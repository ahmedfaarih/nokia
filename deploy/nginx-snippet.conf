# Add this `location` block inside your existing `server { ... }` block
# for whichever domain/subdomain should serve the reconciliation tool.
# Adjust the path prefix if you want it under a subpath instead of "/".

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # file uploads can be a few MB (xlsx files)
    client_max_body_size 30m;
}
