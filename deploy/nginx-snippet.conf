# Add this `location` block inside your existing `server { ... }` block
# for whichever domain/subdomain should serve the reconciliation tool.
#
# Streamlit (v2 / ReconRadar) talks to the browser over a WebSocket, not
# plain HTTP - without the Upgrade/Connection headers and a long read
# timeout below, the page loads but never actually connects (it just spins
# or shows "Please wait..." forever).

location / {
    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;

    # Required for Streamlit's WebSocket connection
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streamlit holds the WebSocket open for the whole session - nginx's
    # default 60s read timeout would silently drop it mid-use.
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # file uploads can be a few MB (xlsx files); matches [server] maxUploadSize
    # in v2/.streamlit/config.toml (500 MB) - lower this if you'd rather cap it.
    client_max_body_size 500m;
}
