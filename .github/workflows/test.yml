name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recon_tool/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Placeholder smoke check - replace with the real test command(s)
      # once they're available (e.g. `pytest`).
      - name: Smoke test (app imports cleanly)
        run: python -c "import main"
